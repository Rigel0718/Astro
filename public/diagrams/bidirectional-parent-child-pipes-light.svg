<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Parent and child process connected by two one-way pipes</title>
  <desc id="diagram-desc">The parent process writes through its file descriptor table to Pipe A's kernel buffer, which connects to file descriptor 0, standard input, in the child. The child writes from file descriptor 1, standard output, through its file descriptor table to Pipe B's kernel buffer, which connects to a read descriptor in the parent. Each pipe carries data in only one direction.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0d9488"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
  </defs>
  <style>
    .canvas{fill:#f8fafc}.divider{stroke:#cbd5e1}.process{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}.kernel{fill:#f0fdfa;stroke:#5eead4;stroke-width:1.5}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.fd-card{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.pipe-a{fill:#ccfbf1;stroke:#0d9488;stroke-width:1.75;filter:url(#shadow)}.pipe-b{fill:#dbeafe;stroke:#2563eb;stroke-width:1.75;filter:url(#shadow)}
    .eyebrow{fill:#0d9488;font:700 14px ui-monospace,monospace;letter-spacing:1.6px}.title{fill:#0f172a;font:700 32px ui-sans-serif,system-ui,sans-serif;letter-spacing:-.6px}.subtitle{fill:#64748b;font:400 16px ui-sans-serif,system-ui,sans-serif}.zone-label{fill:#0f766e;font:700 12px ui-monospace,monospace;letter-spacing:1.1px}.process-title{fill:#0f172a;font:700 22px ui-sans-serif,system-ui,sans-serif}.card-title{fill:#0f172a;font:700 16px ui-sans-serif,system-ui,sans-serif}.note{fill:#64748b;font:500 13px ui-sans-serif,system-ui,sans-serif}.mono{fill:#0f172a;font:600 14px ui-monospace,monospace}.a-text{fill:#0f766e;font:700 13px ui-sans-serif,system-ui,sans-serif}.b-text{fill:#1d4ed8;font:700 13px ui-sans-serif,system-ui,sans-serif}.flow-a{fill:none;stroke:#0d9488;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-a)}.flow-b{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-b)}.table-line{stroke:#cbd5e1}.pill-a{fill:#ccfbf1;stroke:#0d9488}.pill-b{fill:#dbeafe;stroke:#2563eb}
  </style>
  <rect class="canvas" width="1000" height="760" rx="20"/>
  <text class="eyebrow" x="54" y="58">INTER-PROCESS COMMUNICATION</text>
  <text class="title" x="54" y="103">Two pipes · two one-way data flows</text>
  <text class="subtitle" x="54" y="136">File descriptors connect user-space streams to kernel-managed pipe buffers</text>
  <line class="divider" x1="54" y1="164" x2="946" y2="164"/>

  <rect class="process" x="54" y="194" width="260" height="492" rx="14"/>
  <text class="zone-label" x="78" y="226">USER SPACE</text>
  <text class="process-title" x="78" y="263">Parent Process</text>
  <rect class="card" x="78" y="286" width="212" height="78" rx="10"/>
  <text class="card-title" x="184" y="317" text-anchor="middle">Application code</text>
  <text class="note" x="184" y="342" text-anchor="middle">send request · receive result</text>
  <rect class="fd-card" x="78" y="391" width="212" height="232" rx="10"/>
  <text class="card-title" x="98" y="423">File Descriptor Table</text>
  <text class="note" x="98" y="445">process-local references</text>
  <line class="table-line" x1="98" y1="462" x2="270" y2="462"/>
  <rect class="pill-a" x="98" y="483" width="172" height="52" rx="8"/>
  <text class="mono" x="112" y="505">write FD</text><text class="a-text" x="112" y="525">→ Pipe A write end</text>
  <rect class="pill-b" x="98" y="551" width="172" height="52" rx="8"/>
  <text class="mono" x="112" y="573">read FD</text><text class="b-text" x="112" y="593">← Pipe B read end</text>

  <rect class="kernel" x="346" y="194" width="308" height="492" rx="14"/>
  <text class="zone-label" x="370" y="226">LINUX KERNEL</text>
  <text class="process-title" x="370" y="263">Pipe buffers</text>
  <rect class="pipe-a" x="370" y="327" width="260" height="112" rx="12"/>
  <text class="a-text" x="392" y="358">PIPE A · Parent → Child</text>
  <text class="card-title" x="392" y="389">Kernel Pipe Buffer</text>
  <text class="note" x="392" y="414">byte stream · one direction only</text>
  <rect class="pipe-b" x="370" y="493" width="260" height="112" rx="12"/>
  <text class="b-text" x="392" y="524">PIPE B · Child → Parent</text>
  <text class="card-title" x="392" y="555">Kernel Pipe Buffer</text>
  <text class="note" x="392" y="580">byte stream · one direction only</text>

  <rect class="process" x="686" y="194" width="260" height="492" rx="14"/>
  <text class="zone-label" x="710" y="226">USER SPACE</text>
  <text class="process-title" x="710" y="263">Child Process</text>
  <rect class="card" x="710" y="286" width="212" height="78" rx="10"/>
  <text class="card-title" x="816" y="317" text-anchor="middle">Application code</text>
  <text class="note" x="816" y="342" text-anchor="middle">read request · write result</text>
  <rect class="fd-card" x="710" y="391" width="212" height="232" rx="10"/>
  <text class="card-title" x="730" y="423">File Descriptor Table</text>
  <text class="note" x="730" y="445">standard streams remapped</text>
  <line class="table-line" x1="730" y1="462" x2="902" y2="462"/>
  <rect class="pill-a" x="730" y="483" width="172" height="52" rx="8"/>
  <text class="mono" x="744" y="505">FD 0 · stdin</text><text class="a-text" x="744" y="525">← Pipe A read end</text>
  <rect class="pill-b" x="730" y="551" width="172" height="52" rx="8"/>
  <text class="mono" x="744" y="573">FD 1 · stdout</text><text class="b-text" x="744" y="593">→ Pipe B write end</text>

  <path class="flow-a" d="M270 509 H328 Q344 509 344 493 V383 H368"/>
  <path class="flow-a" d="M630 383 H672 Q688 383 688 399 V509 H728"/>
  <path class="flow-b" d="M730 577 H672 Q656 577 656 561 V549 H632"/>
  <path class="flow-b" d="M370 549 H328 Q312 549 312 565 V577 H272"/>
  <text class="a-text" x="500" y="306" text-anchor="middle">write → buffer → read</text>
  <text class="b-text" x="500" y="637" text-anchor="middle">read ← buffer ← write</text>
  <text class="note" x="500" y="716" text-anchor="middle">Two independent pipes provide bidirectional communication; each pipe itself remains one-way.</text>
</svg>
