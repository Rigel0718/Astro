<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">File descriptor table architecture</title>
  <desc id="diagram-desc">A Python process contains file descriptors 3 and 4 in its file descriptor table. Each descriptor points to a separate open file description in the Linux kernel, with an independent file offset and shared read-only access mode. Both open file descriptions point to the same file metadata for example.txt.</desc>

  <defs>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0d9488" />
    </marker>
  </defs>

  <style>
    .canvas { fill: #f8fafc; }
    .divider { stroke: #cbd5e1; stroke-width: 1; }
    .process-zone { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .kernel-zone { fill: #f0fdfa; stroke: #5eead4; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#card-shadow); }
    .card-accent { fill: #ffffff; stroke: #0d9488; stroke-width: 1.75; filter: url(#card-shadow); }
    .eyebrow { fill: #0d9488; font: 700 14px ui-monospace, monospace; letter-spacing: 1.6px; }
    .title { fill: #0f172a; font: 700 34px ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.7px; }
    .subtitle { fill: #64748b; font: 400 17px ui-sans-serif, system-ui, sans-serif; }
    .zone-label { fill: #0f766e; font: 700 12px ui-monospace, monospace; letter-spacing: 1.2px; }
    .card-title { fill: #0f172a; font: 700 17px ui-sans-serif, system-ui, sans-serif; }
    .card-note { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    .mono { fill: #0f172a; font: 600 15px ui-monospace, monospace; }
    .fd-number { fill: #0f766e; font: 700 22px ui-monospace, monospace; }
    .table-line { stroke: #cbd5e1; stroke-width: 1; }
    .connector { fill: none; stroke: #0d9488; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .lookup { fill: none; stroke: #64748b; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-label-bg { fill: #f8fafc; }
    .connector-label { fill: #0f766e; font: 700 12px ui-monospace, monospace; letter-spacing: 0.5px; }
    .shared-pill { fill: #ccfbf1; stroke: #0d9488; stroke-width: 1; }
    .shared-text { fill: #0f766e; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
  </style>

  <rect class="canvas" width="960" height="760" rx="20" />
  <text class="eyebrow" x="64" y="66">RESOURCE LOOKUP</text>
  <text class="title" x="64" y="114">FD Table Architecture</text>
  <text class="subtitle" x="64" y="148">Process-local integers → kernel open state → shared file identity</text>
  <line class="divider" x1="64" y1="178" x2="896" y2="178" />

  <rect class="process-zone" x="64" y="210" width="312" height="454" rx="14" />
  <text class="zone-label" x="88" y="242">PROCESS · USER SPACE</text>

  <rect class="card" x="88" y="270" width="264" height="76" rx="10" />
  <text class="card-title" x="220" y="301" text-anchor="middle">Python Program</text>
  <text class="card-note" x="220" y="325" text-anchor="middle">fd1 = 3 · fd2 = 4</text>

  <rect class="card-accent" x="88" y="378" width="264" height="238" rx="10" />
  <text class="card-title" x="112" y="412">File Descriptor Table</text>
  <text class="card-note" x="112" y="434">Private to this process</text>
  <line class="table-line" x1="112" y1="454" x2="328" y2="454" />
  <text class="card-note" x="126" y="480">FD</text>
  <text class="card-note" x="202" y="480">Kernel reference</text>
  <rect class="shared-pill" x="112" y="495" width="216" height="44" rx="8" />
  <text class="fd-number" x="138" y="525">3</text>
  <text class="mono" x="202" y="522">→ open A</text>
  <rect class="shared-pill" x="112" y="550" width="216" height="44" rx="8" />
  <text class="fd-number" x="138" y="580">4</text>
  <text class="mono" x="202" y="577">→ open B</text>
  <path class="lookup" d="M188 346 V362 H104 V517 H110" />
  <path class="lookup" d="M252 346 V362 H340 V572 H330" />

  <rect class="kernel-zone" x="408" y="210" width="488" height="454" rx="14" />
  <text class="zone-label" x="432" y="242">LINUX KERNEL</text>

  <rect class="card-accent" x="464" y="270" width="264" height="120" rx="10" />
  <text class="card-title" x="488" y="304">Open File Description A</text>
  <text class="mono" x="488" y="337">offset: 0</text>
  <text class="mono" x="488" y="366">access: O_RDONLY</text>

  <rect class="card-accent" x="464" y="420" width="264" height="120" rx="10" />
  <text class="card-title" x="488" y="454">Open File Description B</text>
  <text class="mono" x="488" y="487">offset: 0</text>
  <text class="mono" x="488" y="516">access: O_RDONLY</text>

  <rect class="card" x="760" y="342" width="112" height="126" rx="10" />
  <text class="card-title" x="816" y="377" text-anchor="middle">File</text>
  <text class="card-title" x="816" y="399" text-anchor="middle">Metadata</text>
  <text class="mono" x="816" y="429" text-anchor="middle">example.txt</text>
  <text class="card-note" x="816" y="450" text-anchor="middle">same inode</text>

  <path class="connector" d="M328 517 H426 Q440 517 440 503 V330 H462" />
  <path class="connector" d="M328 572 H426 Q440 572 440 558 V480 H462" />
  <path class="connector" d="M728 330 H742 Q748 330 748 344 V376 Q748 390 758 390" />
  <path class="connector" d="M728 480 H742 Q748 480 748 466 V434 Q748 420 758 420" />

  <rect class="connector-label-bg" x="390" y="287" width="100" height="26" rx="13" />
  <text class="connector-label" x="440" y="305" text-anchor="middle">REFERENCES</text>
  <rect class="shared-pill" x="646" y="574" width="202" height="42" rx="21" />
  <text class="shared-text" x="747" y="600" text-anchor="middle">Same file · separate offsets</text>
</svg>
